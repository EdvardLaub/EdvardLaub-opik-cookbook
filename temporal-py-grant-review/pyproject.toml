[project]
name = "temporal-py-grant-review"
version = "0.1.0"
description = "Durable grant-application review on Temporal (Python) with OpenAI, traced across client and worker processes in Opik"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.31.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opik>=2.2.100",
    "python-dotenv>=1.2.4",
    "temporalio[opentelemetry]>=1.34.0",
]

[project.scripts]
grant-review = "grantreview.demo:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grantreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
