[project]
name = "pydantic-ai-lost-and-found-intake"
version = "0.1.0"
description = "Pydantic AI agent that turns messy lost-and-found desk notes into typed records, traced to Opik over OTel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "logfire>=5.2.0",
    "opik>=2.2.100",
    "pydantic-ai>=2.31.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
lostfound = "lostfound.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lostfound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
