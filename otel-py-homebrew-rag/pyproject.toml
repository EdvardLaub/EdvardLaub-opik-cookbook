[project]
name = "otel-py-homebrew-rag"
version = "0.1.0"
description = "A FastAPI home-brewing FAQ service (RAG over a fictional brewing guide) traced into Opik with nothing but the OpenTelemetry SDK"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-openai-v2==2.4b0",
    # 1.2b0 renamed opentelemetry.util.genai.instruments, which openai-v2 2.4b0 imports: pin 1.1b0
    "opentelemetry-util-genai==1.1b0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brewfaq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
