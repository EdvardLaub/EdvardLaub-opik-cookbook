[project]
name = "beeai-py-expense-triage"
version = "0.1.0"
description = "A BeeAI ReAct agent that triages employee expense reports with policy, per-diem and prior-claim tools"
requires-python = ">=3.12"
dependencies = [
    "beeai-framework>=0.1.85",
    "python-dotenv>=1.0",
    "openinference-instrumentation-beeai>=0.1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.scripts]
expense-triage = "expense_triage.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expense_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
