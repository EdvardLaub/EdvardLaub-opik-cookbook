[project]
name = "langgraph-postmortem-team"
version = "0.1.0"
description = "A planner, investigators and writer team in LangGraph that drafts a blameless incident post-mortem from offline evidence"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.7",
    "langgraph>=1.2",
    "opik>=2.2.100",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postmortem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
