[project]
name = "dspy-claim-verifier"
version = "0.1.0"
description = "A DSPy claim verifier that fails its output-format contract until BootstrapFewShot compiles it"
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
